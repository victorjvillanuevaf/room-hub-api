services:
  postgres:
    image: postgres:16-alpine
    container_name: room-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-room_hub}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  seed:
    image: node:20-alpine
    container_name: room-hub-seed
    working_dir: /app
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    volumes:
      - ./:/app
    command: sh -c "npm ci && npm run seed"
    restart: 'no'

  migrate:
    image: node:20-alpine
    container_name: room-hub-migrate
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    volumes:
      - ./:/app
    command: sh -c "npm ci && npm run migration:run"
    restart: 'no'

volumes:
  postgres_data: